<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neko Tower</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link id="fontcss" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
  :root{--ink:#1b1a3a;--paper:#fffdf5;--pink:#ff7aa8;--sun:#ffd23f;--h:330;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Bangers,Impact,sans-serif;color:var(--ink)}
  /* Céu de anime: o tom muda conforme a torre sobe (variável --h) */
  body{background:linear-gradient(var(--c1,#ffb3cf),var(--c2,#ffd9c2) 62%,var(--c3,#fff6d6))}
  /* As cores --c1..--c3 são calculadas pelo cenário da altura da torre (ver scenery) */
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;outline:none}
  /* Caixas "desenhadas à mão": borda irregular + filtro de traço tremido + sombra deslocada */
  .box{background:var(--paper);border:.8vmin solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:1.2vmin 1.2vmin 0 var(--ink);filter:url(#rough);text-align:center;letter-spacing:.06em;color:var(--ink);font-family:inherit;appearance:none;padding:0;margin:0}
  #menu{position:fixed;z-index:3;left:5vw;top:calc(env(safe-area-inset-top,0px) + 6vh);width:42vw;max-width:340px;height:66vh;display:flex;flex-direction:column;gap:2.2vh;transition:transform .95s cubic-bezier(.65,-.25,.75,1)}
  #menu.out{transform:translateX(-150%)}
  #menu .grp{display:contents}
  #logo{flex:1.5;background:var(--sun);transform:rotate(-2deg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5vmin;line-height:.95}
  #logo small{font-size:4vmin;letter-spacing:.1em;margin-top:.6vh}
  .btn{flex:1;font-size:6.6vmin;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
  #play{background:var(--pink);transform:rotate(1.4deg)}
  #cfg,#back{transform:rotate(-1deg)}
  .btn:active{transform:translate(.8vmin,.8vmin);box-shadow:.3vmin .3vmin 0 var(--ink)}
  #score{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 3vh);left:0;right:0;text-align:center;font-size:19vmin;color:#fff;-webkit-text-stroke:1.6vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .6s .5s}
  #score.on{opacity:1}
  #over{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);transform:translateX(-50%) rotate(-1deg);padding:2vh 6vw;font-size:7vmin;white-space:nowrap;pointer-events:none}
  #over small{display:block;font-size:4.2vmin;margin-top:.8vh}
  /* Online: campo do código, resumo da sala e ranking */
  #codeIn{flex:1;font-size:7.4vmin;text-transform:uppercase;min-width:0;outline:none}
  #codeIn::placeholder{color:#1b1a3a66}
  #roomInfo,#misInfo,#sknInfo{flex:2.4;font-size:4.4vmin;white-space:pre-line;display:flex;align-items:center;justify-content:center;line-height:1.25;padding:0 2vw}
  #rank{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 1.2vh);right:3vw;font-size:4.4vmin;color:#fff;-webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;pointer-events:none}
  #overTxt{white-space:pre-line}
  #misInfo{font-size:3.5vmin;flex:4}
  /* Cenários desenhados atrás do jogo (camadas controladas por scenery) */
  #bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  #bg>div{position:absolute;will-change:transform,opacity}
  #city{left:0;right:0;bottom:0;height:42vh;background-repeat:repeat-x;background-size:auto 100%;background-position:bottom}
  #clouds{left:0;right:0;top:0;height:100vh;opacity:0}
  .cl{position:absolute;width:34vmin;height:20vmin;background-size:contain;background-repeat:no-repeat}
  #stars{left:0;right:0;top:-20vh;height:140vh;opacity:0;background-size:300px 300px;animation:twinkle 3s infinite alternate}
  #moon{right:9vw;top:7vh;width:30vmin;height:30vmin;opacity:0;background-size:contain}
  @keyframes twinkle{from{filter:brightness(.7)}to{filter:brightness(1.3)}}
  /* Efeitos de combo: palavra de mangá + raios de velocidade */
  #pop{position:fixed;z-index:4;left:0;right:0;top:24vh;text-align:center;pointer-events:none}
  .pw{position:absolute;left:0;right:0;font-size:11vmin;color:#fff;-webkit-text-stroke:1.5vmin var(--ink);paint-order:stroke fill;text-shadow:.9vmin .9vmin 0 var(--ink);animation:pw .95s forwards}
  @keyframes pw{0%{transform:scale(.3) rotate(-14deg);opacity:0}18%{transform:scale(1.25) rotate(-5deg);opacity:1}35%{transform:scale(1) rotate(-3deg)}75%{opacity:1}100%{transform:translateY(-9vh) rotate(-3deg);opacity:0}}
  #rays{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.75) 0 3deg,transparent 3deg 11deg);-webkit-mask-image:radial-gradient(circle at 50% 62%,transparent 28%,#000 75%);mask-image:radial-gradient(circle at 50% 62%,transparent 28%,#000 75%)}
  #rays.on{animation:rays .5s ease-out}
  @keyframes rays{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
  .hide{display:none!important}
@keyframes nkDrop{0%{transform:translateY(-260px);opacity:0}14%{transform:translateY(0);opacity:1}18%{transform:translateY(-10px)}22%,78%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}.nk{animation:nkDrop 3.2s infinite}@media(prefers-reduced-motion:reduce){.nk{animation:none}}
  /* Tela de carregamento: some sozinha quando todas as partes carregarem de verdade */
  #load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:linear-gradient(#ff8fb8,#ffc2a8 55%,#fff0b8);transition:opacity .6s}
  #load.gone{opacity:0;pointer-events:none}
  #load svg{width:min(60vmin,420px);height:auto}
  #ldTitle{font-size:11vmin;color:#fff;-webkit-text-stroke:1.4vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink)}
  #ldBar{width:58vmin;height:3.4vmin;border:.8vmin solid var(--ink);border-radius:2vmin;background:var(--paper);overflow:hidden}
  #ldFill{height:100%;width:0;background:var(--pink);transition:width .35s;position:relative;overflow:hidden}
  #ldFill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:ldShine 1.2s linear infinite}
  @keyframes ldShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  #ldTxt{font-size:4.4vmin;color:var(--ink);text-align:center;padding:0 6vw}
</style>
</head>
<body>
<div id="load"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380"><defs><pattern id="nkh" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1b1a3a" stroke-opacity=".3" stroke-width="3.5"/></pattern></defs><ellipse cx="200" cy="330" rx="130" ry="26" fill="#1b1a3a" fill-opacity=".25"/><g class="nk" style="animation-delay:0.0s"><polygon points="90,245 200,300 200,336 90,281" fill="hsl(262,65%,64%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="200,300 310,245 310,281 200,336" fill="hsl(262,60%,52%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="200,300 310,245 310,281 200,336" fill="url(#nkh)"/><polygon points="200,190 310,245 200,300 90,245" fill="hsl(262,80%,80%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/></g><g class="nk" style="animation-delay:0.45s"><polygon points="116,204 216,254 216,290 116,240" fill="hsl(300,65%,64%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="216,254 316,204 316,240 216,290" fill="hsl(300,60%,52%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="216,254 316,204 316,240 216,290" fill="url(#nkh)"/><polygon points="216,154 316,204 216,254 116,204" fill="hsl(300,80%,80%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/></g><g class="nk" style="animation-delay:0.9s"><polygon points="94,165 188,212 188,248 94,201" fill="hsl(335,65%,64%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="188,212 282,165 282,201 188,248" fill="hsl(335,60%,52%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="188,212 282,165 282,201 188,248" fill="url(#nkh)"/><polygon points="188,118 282,165 188,212 94,165" fill="hsl(335,80%,80%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/></g><g class="nk" style="animation-delay:1.35s"><polygon points="130,120 130,61 156,107" fill="hsl(10,80%,80%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="138,113 128,80 148,108" fill="#ff7aa8" stroke="#1b1a3a" stroke-width="3.3" stroke-linejoin="round"/><polygon points="256,107 282,61 282,120" fill="hsl(10,80%,80%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="264,108 284,80 274,113" fill="#ff7aa8" stroke="#1b1a3a" stroke-width="3.3" stroke-linejoin="round"/><polygon points="120,125 206,168 206,204 120,161" fill="hsl(10,65%,64%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="206,168 292,125 292,161 206,204" fill="hsl(10,60%,52%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><polygon points="206,168 292,125 292,161 206,204" fill="url(#nkh)"/><polygon points="206,82 292,125 206,168 120,125" fill="hsl(10,80%,80%)" stroke="#1b1a3a" stroke-width="6" stroke-linejoin="round"/><g transform="translate(180,173) skewY(26.57)"><ellipse rx="10" ry="15" fill="#1b1a3a"/><ellipse cx="-3" cy="-5" rx="4" ry="5" fill="#fff"/><circle cx="3" cy="5" r="1.9" fill="#fff"/><ellipse cx="16" cy="12" rx="8" ry="4" fill="#ff7aa8" fill-opacity=".7"/></g><g transform="translate(232,173) skewY(-26.57)"><ellipse rx="10" ry="15" fill="#1b1a3a"/><ellipse cx="-3" cy="-5" rx="4" ry="5" fill="#fff"/><circle cx="3" cy="5" r="1.9" fill="#fff"/><ellipse cx="-16" cy="12" rx="8" ry="4" fill="#ff7aa8" fill-opacity=".7"/></g></g></svg><div id="ldTitle">NEKO TOWER</div><div id="ldBar"><div id="ldFill"></div></div><div id="ldTxt">Carregando...</div><button id="ldRetry" class="box btn hide" style="flex:none;padding:1vh 6vw" onclick="location.reload()">Tentar de novo</button></div>
<script>
// Progresso REAL: cada parte só conta quando de fato terminou; nenhuma porcentagem é inventada
const Load = (() => {
  const nomes = { motor: 'motor 3D', fonte: 'fonte do menu', cena: 'cena e shaders', imagem: 'primeira imagem' };
  const feitos = new Set(), g = id => document.getElementById(id), total = Object.keys(nomes).length, MIN_MS = 2500; // tempo mínimo da tela de carregamento (ms)
  function ui() {
    const falta = Object.keys(nomes).filter(k => !feitos.has(k));
    g('ldFill').style.width = (feitos.size / total * 100) + '%';
    g('ldTxt').textContent = falta.length ? 'Carregando ' + nomes[falta[0]] + ' (' + feitos.size + ' de ' + total + ' partes prontas)' : 'Tudo pronto!';
  }
  return {
    done(k) { // quando as 4 partes terminam, a tela some e o menu aparece
      feitos.add(k); ui();
      if (feitos.size === total) setTimeout(() => { g('load').classList.add('gone'); setTimeout(() => g('load').remove(), 700); }, Math.max(150, MIN_MS - performance.now())); // só abre depois de 2,5 s desde que a página abriu
    },
    fail(msg) { g('ldTxt').textContent = msg; g('ldRetry').classList.remove('hide'); g('ldFill').style.background = '#e0405a'; },
    ui
  };
})();
Load.ui();
</script>
<!-- Filtro que deixa o traço das caixas tremido, como desenhado a mão -->
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></svg>
<div id="bg"><div id="stars"></div><div id="moon"></div><div id="clouds"></div><div id="city"></div></div>
<canvas id="c"></canvas>
<div id="score">0</div>

<!-- Menu à esquerda: título, Jogar e Config (3 caixas, como no rascunho) -->
<div id="menu">
  <div id="logo" class="box">NEKO<br>TOWER<small id="bestTxt">empilhe tudo!</small></div>
  <div class="grp" id="main">
    <button id="play" class="box btn">Jogar</button>
    <button id="onlBtn" class="box btn">Online</button>
    <button id="misBtn" class="box btn">Missões</button>
    <button id="sknBtn" class="box btn">Skins</button>

  </div>
  <!-- Online: criar sala ou entrar por código -->
  <div class="grp hide" id="onl">
    <button id="mk" class="box btn">Criar sala</button>
    <input id="codeIn" class="box" maxlength="6" placeholder="CÓDIGO" autocomplete="off">
    <button id="jn" class="box btn">Entrar</button>
    <button id="onlBack" class="box btn">Voltar</button>
  </div>
  <!-- Sala: código, jogadores e início da partida (só o dono inicia) -->
  <div class="grp hide" id="lobby">
    <div id="roomInfo" class="box"></div>
    <button id="start" class="box btn">Iniciar</button>
    <button id="leave" class="box btn">Sair da sala</button>
  </div>
  <!-- Missões diárias e loja de skins -->
  <div class="grp hide" id="mis"><div id="misInfo" class="box"></div><button id="misBack" class="box btn">Voltar</button></div>
  <div class="grp hide" id="skn"><div id="sknInfo" class="box"></div><button id="sknNext" class="box btn">Próxima</button><button id="sknBuy" class="box btn">Equipar</button><button id="sknBack" class="box btn">Voltar</button></div>
  <div class="grp hide" id="conf">

  </div>
</div>
<div id="over" class="box hide">Fim de jogo<small id="overTxt"></small></div>

<div id="pop"></div><div id="rays"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.49.0/babylon.js"></script>
<script>
// Parte 1: o motor 3D chegou da internet? Se não, avisa em vez de ficar travado
if (window.BABYLON) Load.done('motor'); else Load.fail('Não foi possível baixar o motor 3D. Verifique a internet.');
// Parte 2: espera o CSS da fonte e a fonte do menu carregarem (se falhar, segue com a fonte reserva)
(async () => {
  const l = document.getElementById('fontcss');
  await new Promise(r => { if (l.sheet) r(); else { l.addEventListener('load', r); l.addEventListener('error', r); setTimeout(r, 8000); } });
  try { await document.fonts.load('1em Bangers'); } catch (e) {}
  Load.done('fonte');
})();
</script>
<script>
const $ = id => document.getElementById(id);

// ---- Constantes do jogo (unidades do mundo 3D) ----
const H = 0.5;       // altura de cada bloco
const BASE = 3;      // tamanho inicial do bloco
const LIM = 3;       // alcance do movimento do bloco
const TOL = 0.07;    // tolerância do encaixe perfeito
const MENU_SHIFT = 0.4; // quanto o jogo fica deslocado para a direita no menu

// ---- Configurações ----
const cfg = { som: true, line: true, gfx: 1 }; // gfx: 0 = baixo, 1 = médio, 2 = ultra
let best = 0;
try { best = +localStorage.getItem('stackBest') || 0; } catch (e) {}
if (best) $('bestTxt').textContent = 'Melhor: ' + best;

// ---- Motor Babylon ----
const eng = new BABYLON.Engine($('c'), true, { alpha: true, antialias: true });
const scene = new BABYLON.Scene(eng);
scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // fundo transparente: o céu vem do CSS

// Câmera ortográfica isométrica (posição fixa; só sobe junto com a torre)
const RIG = new BABYLON.Vector3(14, 14, -14);
const cm = new BABYLON.FreeCamera('cm', RIG.clone(), scene);
cm.setTarget(BABYLON.Vector3.Zero());
cm.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
cm.minZ = 0.1; cm.maxZ = 100;

// ---- Shader toon: 3 faixas de luz + hachura diagonal na sombra (visual desenhado) ----
BABYLON.Effect.ShadersStore.toonVertexShader = `
precision highp float;
attribute vec3 position; attribute vec3 normal; attribute vec4 color;
uniform mat4 world; uniform mat4 worldViewProjection;
varying vec3 vN; varying vec4 vC; varying vec3 vP;
void main(){ vN = normalize((world * vec4(normal, 0.)).xyz); vC = color; vP = position; gl_Position = worldViewProjection * vec4(position, 1.); }`;
BABYLON.Effect.ShadersStore.toonFragmentShader = `
precision highp float;
varying vec3 vN; varying vec4 vC; varying vec3 vP; uniform vec3 L; uniform float hatch; uniform float skin;
void main(){
  float d = dot(normalize(vN), normalize(L));
  float b = d > .7 ? 1. : d > .3 ? .8 : .62;      // faixas de luz (cel shading)
  vec3 col = vC.rgb; float s = floor(skin + .5); bool top = vN.y > .5;
  if (s == 1.) { if (mod((vP.x + vP.z + vP.y * 2.) * 2.6, 1.) < .5) col = mix(col, vec3(1.), .6); }          // doces: listras
  else if (s == 2.) { col = top ? vec3(1., .56, .44) : vec3(.98, .96, .9); if (!top && abs(vP.y) < .1) col = vec3(.1, .2, .15); } // sushi: arroz, alga e salmão
  else if (s == 3.) { bool rib = (abs(vN.x) > .5 && abs(vP.z) < .16) || (abs(vN.z) > .5 && abs(vP.x) < .16) || (top && (abs(vP.x) < .16 || abs(vP.z) < .16)); if (rib) col = vec3(1., .82, .24); } // presente: fita dourada
  else if (s == 4.) { vec3 q = floor(vP / .3); if (mod(q.x + q.y + q.z, 2.) < 1.) col *= .86; col = floor(col * 5.) / 5.; } // pixel art
  vec3 c = col * b;
  if (hatch > 0. && d <= .3 && mod(gl_FragCoord.x + gl_FragCoord.y, 9.) < 2.5) c *= .72; // hachura (some no gráfico baixo)
  gl_FragColor = vec4(c, 1.);
}`;
const toon = new BABYLON.ShaderMaterial('toon', scene, 'toon', { attributes: ['position', 'normal', 'color'], uniforms: ['world', 'worldViewProjection', 'L', 'hatch', 'skin'] });
toon.setVector3('L', new BABYLON.Vector3(0.1, 0.8, -0.6));
const INK = BABYLON.Color3.FromHexString('#1b1a3a');

// Níveis de gráfico: resolução (hardware scaling), contorno de tinta e hachura
const GFX = [
  { nome: 'Baixo', scale: 1.7, line: false, ow: .07, hatch: 0 },
  { nome: 'Médio', scale: 1, line: true, ow: .08, hatch: 1 },
  { nome: 'Ultra', scale: Math.min(.75, 1 / (devicePixelRatio || 1)), line: true, ow: .1, hatch: 1 } // renderiza acima da resolução da tela
];
const Q = () => GFX[cfg.gfx];
function applyGfx() {
  const q = Q();
  eng.setHardwareScalingLevel(q.scale);
  toon.setFloat('hatch', q.hatch);
  scene.meshes.forEach(m => { m.renderOutline = q.line; m.outlineWidth = q.ow; m.outlineColor = INK; });
  $('gfx').textContent = 'Gráfico: ' + q.nome;
}
applyGfx();

// Cria um bloco (caixa) com cor pastel e contorno de tinta
function mk(x, z, w, d, y, hue) {
  const c3 = skinColor(Math.round(y / H), hue), c = new BABYLON.Color4(c3.r, c3.g, c3.b, 1); // cor vem da skin equipada
  const m = BABYLON.MeshBuilder.CreateBox('b', { width: w, height: H, depth: d, faceColors: [c, c, c, c, c, c] }, scene);
  m.position.set(x + w / 2, y + H / 2, z + d / 2);
  m.material = toon;
  m.renderOutline = Q().line; m.outlineWidth = Q().ow; m.outlineColor = INK;
  return m;
}

// ---- Som simples (WebAudio) ----
let ac;
function beep(f, d) {
  if (!cfg.som) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

// ---- Estado ----
let stack = [], mv = null, debris = [], combo = 0, score = 0, hue0 = 0, bgH = 0;
let mode = 'menu';            // menu -> pan (animação de avançar) -> play -> over
let camY = H, shift = MENU_SHIFT, zoom = 1, panT0 = 0, overT = 0, popM = null, pop = 0;

function reset() {
  [...stack, ...debris, mv].forEach(b => b && b.mesh && b.mesh.dispose());
  hue0 = Math.random() * 360 | 0; bgH = hue0; combo = 0; score = 0; debris = []; popM = null; mood = 1;
  $('score').textContent = 0; camY = H;
  stack = [{ x: -BASE / 2, z: -BASE / 2, w: BASE, d: BASE, hue: hue0 }];
  stack[0].mesh = mk(stack[0].x, stack[0].z, BASE, BASE, 0, hue0);
  spawn();
}

// Novo bloco em movimento, alternando eixo x e z
function spawn() {
  const n = stack.length, top = stack[n - 1], axis = n % 2 ? 'x' : 'z', fromLeft = n % 4 < 2;
  mv = { x: top.x, z: top.z, w: top.w, d: top.d, hue: (hue0 + n * 7) % 360, axis, dir: fromLeft ? 1 : -1, speed: Math.min(2.5 + n * 0.06, 5.5) };
  mv[axis] = fromLeft ? -LIM : LIM;
  mv.mesh = mk(mv.x, mv.z, mv.w, mv.d, n * H, mv.hue);
  dressCat(mv.mesh, mv.w, mv.d, skinColor(n, mv.hue)); // o gato carrega o bloco
}

// Pedaço cortado que cai
function fall(x, z, w, d, y, hue) { debris.push({ mesh: mk(x, z, w, d, y, hue), vy: 0 }); }

// Jogador toca: tenta encaixar o bloco
function place() {
  const top = stack[stack.length - 1], m = mv, a = m.axis, sz = a === 'x' ? 'w' : 'd';
  const d = m[a] - top[a], lvl = stack.length * H;
  const nb = { x: m.x, z: m.z, w: m.w, d: m.d, hue: m.hue };
  if (Math.abs(d) <= TOL) {
    // Encaixe perfeito: alinha, soma combo e, com 4+, o bloco volta a crescer um pouco
    nb[a] = top[a]; combo++;
    if (combo >= 4 && nb[sz] < BASE) { const g = Math.min(0.12, BASE - nb[sz]); nb[sz] += g; nb[a] -= g / 2; }
    beep(440 + Math.min(combo, 12) * 55, .25);
    comboFx(combo); mood = 1 + .1 * Math.min(combo, 6); // efeitos e gato animado
  } else {
    combo = 0;
    if (Math.abs(d) >= m[sz]) { m.mesh.dispose(); fall(m.x, m.z, m.w, m.d, lvl, m.hue); mv = null; return gameOver(); }
    const cut = Math.abs(d), f = { x: m.x, z: m.z, w: m.w, d: m.d };
    nb[sz] = m[sz] - cut;
    if (d > 0) { f[a] = m[a] + nb[sz]; f[sz] = cut; } else { nb[a] = top[a]; f[sz] = cut; }
    fall(f.x, f.z, f.w, f.d, lvl, m.hue);
    beep(220, .15); mood = .75; // gato preocupado
  }
  m.mesh.dispose();
  nb.mesh = mk(nb.x, nb.z, nb.w, nb.d, lvl, nb.hue);
  if (combo > 0) { popM = nb.mesh; pop = 1; } // "pulinho" no encaixe perfeito
  stack.push(nb); score++; $('score').textContent = score; spawn();
  if (net.active) net.room.presence({ sc: score }); // online: compartilha o placar
  onScore();
}

function gameOver() {
  mode = 'over'; overT = performance.now(); beep(110, .5); Mis.add('jogos', 1);
  if (score > best) { best = score; try { localStorage.setItem('stackBest', best); } catch (e) {} }
  if (net.active) { // online: registra quanto tempo sobreviveu e mostra o ranking
    net.room.presence({ alive: false, t: (performance.now() - net.t0) / 1000, sc: score }); renderRank();
  } else $('overTxt').textContent = 'Pontos: ' + score + '  |  Melhor: ' + best + '  |  Toque para jogar de novo';
  $('over').classList.remove('hide');
}

// Toque em qualquer lugar: empilha (ou reinicia depois do fim de jogo)
function tap(e) {
  if (e.target.closest && e.target.closest('#menu')) return;
  if (mode === 'play') place();
  else if (mode === 'over' && performance.now() - overT > 500) {
    if (net.active) { if (net.done) backToLobby(); return; } // online: só volta à sala quando todos terminarem
    $('over').classList.add('hide'); reset(); mode = 'play';
  }
}
addEventListener('pointerdown', tap);
addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') tap({ target: document.body }); });

// Materiais simples (cor chapada) para o gato; guardados para reaproveitar
const dmCache = {};
const dm = c => dmCache[c.toHexString()] || (dmCache[c.toHexString()] = Object.assign(new BABYLON.StandardMaterial('dm', scene), { diffuseColor: BABYLON.Color3.Black(), specularColor: BABYLON.Color3.Black(), emissiveColor: c }));

// Gato no bloco em movimento: orelhas, carinha (muda por skin e humor) e enfeite
function dressCat(m, w, d, col) {
  const sk = SK[skinI], MB = BABYLON.MeshBuilder, top = H / 2;
  const add = (me, x, y, z, c, line = true) => { me.parent = m; me.position.set(x, y, z); me.material = dm(c); me.renderOutline = line && Q().line; me.outlineWidth = .04; me.outlineColor = INK; return me; };
  const ball = (x, y, z, dia, c) => add(MB.CreateSphere('a', { diameter: dia, segments: 8 }, scene), x, y, z, c);
  const laco = (x, y, z, c, s) => { ball(x - .14 * s, y, z - .14 * s, .26 * s, c); ball(x + .14 * s, y, z + .14 * s, .26 * s, c); ball(x, y, z, .18 * s, c); };
  // Orelhas (cones de 3 lados); o eixo da direita da tela é (x, z)
  [-1, 1].forEach(s => add(MB.CreateCylinder('o', { diameterTop: 0, diameterBottom: .6, height: .6, tessellation: 3 }, scene), s * .3 * w - .12 * w, top + .3, s * .3 * d + .12 * d, col));
  // Olhos nas duas faces voltadas para a câmera
  const eye = (x, z, face) => {
    const e = sk.olho === 'q' ? MB.CreateBox('e', { size: .26 }, scene) : MB.CreateSphere('e', { diameter: .3, segments: 8 }, scene);
    add(e, x, 0, z, INK, false);
    e.scaling.set(face === 'x' ? .45 : 1, (sk.olho === 'u' ? .3 : 1.4) * mood, face === 'z' ? .45 : 1);
  };
  eye(w * .28, -d / 2, 'z'); eye(w / 2, -d * .28, 'x');
  // Enfeite de cada skin
  const A = sk.acess;
  if (A === 'laco') laco(.18 * w, top + .6, .42 * d, ROSA, 1);
  if (A === 'presente') laco(0, top + .15, 0, OURO, 1.8);
  if (A === 'festa') { add(MB.CreateCylinder('h', { diameterTop: 0, diameterBottom: .5, height: .8, tessellation: 12 }, scene), 0, top + .4, 0, ROSA); ball(0, top + .85, 0, .2, OURO); }
  if (A === 'chef') { add(MB.CreateCylinder('h', { diameter: .6, height: .4, tessellation: 12 }, scene), 0, top + .2, 0, BRANCO); ball(0, top + .5, 0, .7, BRANCO); }
  if (A === 'coroa') [-1, 0, 1].forEach(i => add(MB.CreateBox('c', { width: .18, height: i ? .3 : .45, depth: .18 }, scene), i * .2, top + .2, i * .2, OURO));
}

// ================= Missões diárias =================
// premio = moedas ganhas (ajuste à vontade). Progresso: "combo" e "score" guardam o maior valor; "perf" e "jogos" somam.
const POOL = [
  { id: 'combo3', txt: 'Faça 3 encaixes perfeitos seguidos', chave: 'combo', meta: 3, premio: 20 },
  { id: 'combo5', txt: 'Faça 5 encaixes perfeitos seguidos', chave: 'combo', meta: 5, premio: 40 },
  { id: 'blocos15', txt: 'Chegue a 15 blocos', chave: 'score', meta: 15, premio: 15 },
  { id: 'blocos30', txt: 'Chegue a 30 blocos', chave: 'score', meta: 30, premio: 30 },
  { id: 'perf10', txt: 'Faça 10 encaixes perfeitos', chave: 'perf', meta: 10, premio: 25 },
  { id: 'jogos5', txt: 'Jogue 5 partidas', chave: 'jogos', meta: 5, premio: 15 }
];
const hojeKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function sorteia(k) { // as mesmas 3 missões o dia inteiro (sorteio pela data)
  let n = 0; for (const ch of k) n = (n * 31 + ch.charCodeAt(0)) >>> 0;
  const ids = POOL.map((_, i) => i), out = [];
  while (out.length < 3) { out.push(ids.splice(n % ids.length, 1)[0]); n = Math.floor(n / 7) + 3; }
  return out;
}
const Mis = {
  ativas() { // novo dia: sorteia 3 missões e zera o progresso
    const k = hojeKey();
    if (sv.dia !== k) { sv.dia = k; sv.ids = sorteia(k); sv.prog = {}; sv.pegas = {}; salvar(); }
    return sv.ids.map(i => POOL[i]);
  },
  add(chave, v) { this.upd(chave, (sv.prog[chave] || 0) + v); },
  max(chave, v) { if (v > (sv.prog[chave] || 0)) this.upd(chave, v); },
  upd(chave, v) { // atualiza o progresso e paga a missão assim que a meta é batida
    sv.prog[chave] = v;
    this.ativas().forEach(m => { if (m.chave === chave && !sv.pegas[m.id] && v >= m.meta) { sv.pegas[m.id] = 1; sv.moedas += m.premio; popText('Missão completa! +' + m.premio, 1, 7, 16); } });
    salvar();
  }
};
function renderMis() {
  $('misInfo').textContent = 'Moedas: ' + sv.moedas + '\n\n' + Mis.ativas().map(m => (sv.pegas[m.id] ? '✔ ' : '• ') + m.txt + ' (' + Math.min(sv.prog[m.chave] || 0, m.meta) + '/' + m.meta + ') +' + m.premio).join('\n');
}

// ---- Online: salas por código (recurso "room" do claude.ai). Vence quem sobrevive mais tempo ----
const net = { api: null, room: null, code: '', host: false, ready: false, active: false, done: false, lastGo: 0, t0: 0, unsub: null,
  nick: 'Jogador' + (100 + Math.random() * 900 | 0) };

(async () => { try { net.api = await claude.use('room'); } catch (e) {} })();
const setStatus = t => { $('bestTxt').textContent = t; };
const idleStatus = () => setStatus(best ? 'Melhor: ' + best : 'empilhe tudo!');

// Entra (ou cria, se host) a sala com o código
async function joinRoom(code, host) {
  if (!net.api) return setStatus('Online indisponível aqui');
  setStatus('Entrando...');
  try { net.room = await net.api.join('stk-' + code.toLowerCase()); } catch (e) { return setStatus('Não foi possível entrar'); }
  Object.assign(net, { code: code.toUpperCase(), host, ready: host, active: false, done: false, lastGo: 0 });
  net.unsub = net.room.onPeers(onNet);
  await net.room.presence({ n: net.nick, host, go: null, rd: null, alive: false, t: 0, sc: 0 });
  showGrp('lobby'); $('start').classList.toggle('hide', !host); idleStatus(); renderLobby();
  if (!host) setTimeout(async () => { // sem dono na sala = código inexistente
    const h = net.room && net.room.peers().find(p => p.presence.host);
    if (net.room && !h) { await leaveRoom(); setStatus('Sala não encontrada'); }
    else if (h) { net.lastGo = h.presence.go || 0; net.ready = true; } // ignora partidas que já aconteceram
  }, 2500);
}
async function leaveRoom() {
  try { net.unsub && net.unsub(); net.room && await net.room.leave(); } catch (e) {}
  net.room = null; net.active = false; showGrp('onl'); idleStatus();
}
function renderLobby() {
  const ps = net.room.peers().slice(0, 6);
  $('roomInfo').textContent = 'Sala ' + net.code + '\n' + ps.map(p => (p.presence.host ? '★ ' : '') + (p.presence.n || '?') + (p.isMe ? ' (você)' : '')).join('\n');
}
// Chamado quando alguém entra, sai ou muda o estado
function onNet() {
  if (!net.room) return;
  renderLobby();
  const h = net.room.peers().find(p => p.presence.host);
  // O dono mandou iniciar: todos começam a rodada juntos
  if (net.ready && h && h.presence.go && h.presence.go !== net.lastGo && (!net.active || net.done)) startOnline(h.presence.go);
  if (net.active) renderRank();
}
function startOnline(go) {
  net.lastGo = go; net.active = true; net.done = false;
  net.room.presence({ rd: go, alive: true, t: 0, sc: 0 });
  $('over').classList.add('hide'); reset();
  mode = 'pan'; panT0 = performance.now(); beep(523, .2); // mesma animação de avançar do modo solo
  $('menu').classList.add('out'); $('score').classList.add('on'); $('rank').classList.remove('hide');
}
// Ranking: quem sobreviveu mais tempo fica em 1º (quem ainda joga fica no topo)
function renderRank() {
  const ps = net.room.peers().filter(p => p.presence.rd === net.lastGo);
  const vivos = ps.filter(p => p.presence.alive).length;
  $('rank').textContent = 'Vivos: ' + vivos + '/' + ps.length;
  net.done = ps.length > 0 && vivos === 0;
  if (mode !== 'over') return;
  const rows = ps.slice().sort((a, b) => (b.presence.alive ? 1e9 : b.presence.t) - (a.presence.alive ? 1e9 : a.presence.t));
  $('overTxt').textContent = rows.map((p, i) => (i + 1) + 'º ' + (p.presence.n || '?') + (p.isMe ? ' (você)' : '') +
    (p.presence.alive ? ' - jogando' : ' - ' + (+p.presence.t).toFixed(1) + 's | ' + p.presence.sc + ' blocos')).join('\n') +
    (net.done ? '\nToque para voltar à sala' : '');
}
function backToLobby() {
  net.active = false; net.done = false;
  net.room.presence({ rd: null, alive: false });
  $('over').classList.add('hide'); $('rank').classList.add('hide'); $('score').classList.remove('on');
  $('menu').classList.remove('out'); showGrp('lobby');
  reset(); mode = 'menu'; shift = MENU_SHIFT; zoom = 1;
}
$('onlBtn').onclick = () => { showGrp('onl'); if (!net.api) setStatus('Online: abra pelo link do claude.ai'); };
$('onlBack').onclick = () => { showGrp('main'); idleStatus(); };
$('mk').onclick = () => { // código de 5 caracteres sem letras confusas
  const c = Array.from({ length: 5 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random() * 31 | 0]).join('');
  joinRoom(c, true);
};
$('jn').onclick = () => { const c = $('codeIn').value.trim().toUpperCase(); if (c.length >= 4) joinRoom(c, false); };
$('start').onclick = () => net.room && net.room.presence({ go: Date.now() });
$('leave').onclick = leaveRoom;

// ---- Botões do menu ----
$('play').onclick = () => {
  if (mode !== 'menu') return;
  mode = 'pan'; panT0 = performance.now(); beep(523, .2);
  $('menu').classList.add('out');   // menu desliza para a esquerda
  $('score').classList.add('on');
};
$('cfg').onclick = () => { $('main').classList.add('hide'); $('conf').classList.remove('hide'); };
$('back').onclick = () => { $('conf').classList.add('hide'); $('main').classList.remove('hide'); };
$('snd').onclick = e => { cfg.som = !cfg.som; e.target.textContent = 'Som: ' + (cfg.som ? 'Ligado' : 'Desligado'); };
$('gfx').onclick = () => { cfg.gfx = (cfg.gfx + 1) % 3; applyGfx(); }; // alterna Baixo, Médio e Ultra

// ---- Loop principal ----
reset();
// Parte 3: espera os materiais/shaders da cena compilarem de verdade
scene.executeWhenReady(() => Load.done('cena'));
let frames = 0;
eng.runRenderLoop(() => {
  const dt = Math.min(eng.getDeltaTime() / 1000, .05);

  // Animação de avançar: a câmera desliza até o jogo e aproxima
  if (mode === 'pan') {
    const p = Math.min((performance.now() - panT0) / 1000, 1), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    shift = MENU_SHIFT * (1 - e); zoom = 1.18 - 0.18 * e;
    if (p >= 1) { mode = 'play'; if (net.active) net.t0 = performance.now(); } // online: o relógio começa quando o jogo começa
  }

  // Bloco em movimento (também no menu, como demonstração)
  if (mv && (mode === 'menu' || mode === 'pan' || mode === 'play')) {
    mv[mv.axis] += mv.dir * mv.speed * dt;
    if (mv[mv.axis] > LIM) { mv[mv.axis] = LIM; mv.dir = -1; }
    if (mv[mv.axis] < -LIM) { mv[mv.axis] = -LIM; mv.dir = 1; }
    mv.mesh.position.x = mv.x + mv.w / 2; mv.mesh.position.z = mv.z + mv.d / 2;
  }
  // Pedaços cortados caem
  debris.forEach(b => { b.vy += 14 * dt; b.mesh.position.y -= b.vy * dt; });
  debris = debris.filter(b => b.mesh.position.y > camY - 12 || (b.mesh.dispose(), false));
  // Pulinho do encaixe perfeito
  if (popM && !popM.isDisposed()) { popM.scaling.x = popM.scaling.z = 1 + .12 * Math.max(pop, 0); pop -= dt * 4; if (pop <= 0) { popM.scaling.x = popM.scaling.z = 1; popM = null; } }

  // Câmera sobe com a torre; céu muda de cor
  camY += (stack.length * H - camY) * Math.min(dt * 5, 1);
  cm.position.set(RIG.x, RIG.y + camY, RIG.z);
  scenery(dt); // cenário por altura: céu, cidade, nuvens, estrelas e lua
  

  // Janela ortográfica: topo da torre a ~62% da altura; "shift" empurra o jogo para a direita
  const asp = eng.getRenderWidth() / eng.getRenderHeight();
  const hh = Math.max(9.5, 6.4 / asp) * zoom, hw = hh * asp;
  cm.orthoTop = hh * 1.24; cm.orthoBottom = -hh * .76;
  cm.orthoLeft = -hw - shift * hw; cm.orthoRight = hw - shift * hw;
  scene.render();
  if (frames < 2 && ++frames === 2) Load.done('imagem'); // Parte 4: só libera depois de desenhar 2 quadros reais
});
addEventListener('resize', () => eng.resize());
</script>
